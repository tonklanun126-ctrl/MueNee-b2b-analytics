# ==============================================================================
# MueNee-b2b-analytics: Academic Calendar Configuration
# มหาวิทยาลัยศิลปากร วิทยาเขตพระราชวังสนามจันทร์ อำเภอเมือง จังหวัดนครปฐม
# ==============================================================================
# อ้างอิงระเบียบและปฏิทินการศึกษาระดับปริญญาบัณฑิต มหาวิทยาลัยศิลปากร
# แหล่งอ้างอิง: กองบริการการศึกษา มหาวิทยาลัยศิลปากร (https://reg.su.ac.th/)
# ปีการศึกษา: 2569 (2026-2027)
# ช่วงเวลาครอบคลุม: 2026-08-01 ถึง 2027-07-31 (รวมทั้งสิ้น 365 วัน)
# ==============================================================================

academic_year: 2569
campus: "Sanam Chandra Palace, Nakhon Pathom"
center_coordinates:
  latitude: 13.8199
  longitude: 100.0443
radius_km: 3.0

date_range:
  start_date: "2026-08-01"
  end_date: "2027-07-31"
  total_days: 365

# ตัวคูณอุปสงค์ (Demand Multipliers) ตามที่ระบุใน SPEC.md §4.1
demand_multipliers:
  regular:
    multiplier: 1.00
    description: "ช่วงเปิดภาคการศึกษาปกติ มื้อกลางวันและมื้อเย็นมีอุปสงค์สม่ำเสมอ"
  midterm_exam:
    multiplier: 1.20
    description: "สัปดาห์สอบกลางภาค อุปสงค์มื้อดึก (22:00-02:00) พุ่งสูงเป็นพิเศษ"
    late_night_multiplier: 2.50
  final_exam:
    multiplier: 1.25
    description: "สัปดาห์สอบปลายภาค ยอดมื้อดึกสูงสุด และยอดสังสรรค์พุ่งหลังสอบเสร็จ"
    late_night_multiplier: 3.00
  semester_break:
    multiplier: 0.30
    description: "ช่วงปิดภาคเรียน อุปสงค์ลดลง 60-80% ร้านรอบ ม. ได้รับผลกระทบหนัก"
  summer_session:
    multiplier: 0.50
    description: "ภาคการศึกษาฤดูร้อน มีนักศึกษาบางส่วนลงเรียน"
  public_holiday:
    multiplier: 0.50
    description: "วันหยุดราชการ/วันหยุดนักขัตฤกษ์ นักศึกษากลับภูมิลำเนา"


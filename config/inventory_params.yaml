# ==============================================================================
# MueNee-b2b-analytics: Inventory & Stock Optimization Parameters
# พารามิเตอร์การบริหารสินค้าคงคลังและการจัดซื้อวัตถุดิบ 8 กลุ่ม
# ==============================================================================
# อ้างอิงสมการและการกำหนดค่าใน SPEC.md (§1.5 และ §3.3)
#
# สมการหลัก:
# 1. Safety Stock (สต็อกเพื่อความปลอดภัย):
#    SS = Z_alpha * sigma_d * sqrt(L)
# 2. Reorder Point (จุดสั่งซื้อซ้ำ):
#    ROP = (d_bar * L) + SS
# 3. Recommended Order Quantity with Perishable Cap (ปริมาณสั่งแนะนำไม่เกินอายุของสด):
#    Q* = min( sum_{h=1}^{L+R} d_hat_{t+h} + SS - I_t , sum_{h=1}^{S_g} d_hat_{t+h} )
# ==============================================================================

# พารามิเตอร์ระดับระบบ (System-wide Inventory Policies)
review_period_days: 1          # รอบการตรวจสอบระดับสต็อก (Review Period R = 1 วัน)
holding_cost_annual_rate: 0.25 # อัตราต้นทุนการถือครองสต็อกต่อปี (25% ของมูลค่าสินค้า)
stockout_cost_multiplier: 1.50 # ค่าปรับต้นทุนเสียโอกาสขาย (150% ของ Gross Margin)

# พารามิเตอร์แยกตามกลุ่มวัตถุดิบหลัก 8 กลุ่ม (G1 - G8)
